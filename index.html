<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Smart Timetable Scheduler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Smart Timetable Scheduler</h1>
        <p>Graph-coloring based conflict-free scheduling</p>

        <section class="card">
            <h2>Classes</h2>
            <div class="grid">
                <input id="s" placeholder="Subject">
                <input id="t" placeholder="Teacher">
                <input id="r" placeholder="Room">
                <button onclick="add()">Add</button>
            </div>
            <div id="list"></div>
        </section>

        <section class="card">
            <h2>Conflicts</h2>
            <div class="grid">
                <select id="a"></select>
                <select id="b"></select>
                <button onclick="conflict()">Add Conflict</button>
            </div>
            <div id="cl"></div>
        </section>

        <section class="card">
            <button onclick="generate()">Generate Timetable</button>
            <button onclick="demo()">Load Demo</button>
            <div id="out"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
